name: APK Derle (OBD-Droid)
on:
  push:
    branches: [obd-droid]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }
      - name: Derle
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon 2>&1 | tee build.log || {
            msg=$(grep -E -A3 "error:|^e: |What went wrong|AAPT" build.log | head -50 | cut -c1-250 | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}')
            echo "::error title=DERLEME::$msg"; exit 1; }
      - run: cp "$(find app/build/outputs/apk/debug -name '*.apk' | head -1)" DarkOBD-Full.apk
      - name: APK imzala
        run: |
          S="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$S" sign --key ci/testkey.pk8 --cert ci/testkey.x509.pem DarkOBD-Full.apk
          "$S" verify --print-certs DarkOBD-Full.apk | grep -i a40da80a59d170caa950cf15c18c454d47a39b26989d8b640ecd745ba71bf5dc
      - uses: actions/upload-artifact@v4
        with: { name: DarkOBD-Full, path: DarkOBD-Full.apk }
  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [30, 34]
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v4
        with: { name: DarkOBD-Full }
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          script: bash ci/smoke.sh
  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: DarkOBD-Full }
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "full-${{ github.run_number }}" DarkOBD-Full.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Dark OBD Full (deneme, GPL-3.0)" --notes "OBD-Droid / AndrOBD tabanli. Kaynak kod: bu etiketteki commit. Aracta test edilmedi." --latest=false
