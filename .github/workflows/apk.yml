name: APK Derle (OBD-Droid)
on:
  push:
    branches: [obd-droid]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }
      - run: gradle :app:assembleDebug --no-daemon --stacktrace
      - run: cp "$(find app/build/outputs/apk/debug -name '*.apk' | head -1)" DarkOBD-Full.apk
      - uses: actions/upload-artifact@v4
        with: { name: DarkOBD-Full, path: DarkOBD-Full.apk }
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: DarkOBD-Full }
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "full-${{ github.run_number }}" DarkOBD-Full.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Dark OBD Full (deneme, GPL-3.0)" --notes "OBD-Droid / AndrOBD tabanli. Kaynak kod: bu etiketteki commit. Aracta test edilmedi." --latest=false
