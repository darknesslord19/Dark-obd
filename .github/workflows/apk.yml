name: APK Derle
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DarkOBD-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Release olarak yayinla
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DarkOBD.apk
          gh release create "v0.1-${{ github.run_number }}" DarkOBD.apk --target "${{ github.sha }}" --title "Dark OBD v0.1 (deneme)" --notes "Debug deneme surumu. Gercek aracta henuz test edilmedi." --latest
